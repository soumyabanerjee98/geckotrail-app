name: gecko_trail
description: Gecko Trail — mobile MVP for adventure and off-road riders in India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  google_maps_flutter: ^2.12.1
  geolocator: ^14.0.0
  permission_handler: ^12.0.0+1
  razorpay_flutter: ^1.4.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  intl: ^0.20.2
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  collection: ^1.19.1
  flutter_dotenv: ^5.2.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/brand/
